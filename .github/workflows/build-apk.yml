name: Build APK with EAS
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm install

      - name: Ambil Project ID Otomatis
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # Robot mengambil ID langsung dari server Expo
          PROJECT_ID=$(curl -s -H "Authorization: Bearer $EXPO_TOKEN" "https://api.expo.dev/v2/projects/sopars-team/ai-scaner" | jq -r '.data.id')
          echo "Berhasil menemukan ID: $PROJECT_ID"
          
          # Robot menanamkan ID-nya langsung ke dalam aplikasimu
          jq ".expo.extra.eas.projectId = \"$PROJECT_ID\" | .expo.owner = \"sopars-team\" | .expo.slug = \"ai-scaner\"" app.json > tmp.json && mv tmp.json app.json

      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
        run: eas build --platform android --profile preview --non-interactive
        
